name: Docker images

# Images publiques prêtes à déployer (Coolify, Dokploy, docker compose…) :
#   ghcr.io/<dépôt>-api  et  ghcr.io/<dépôt>-web
# Après le premier run, passe les deux paquets en « Public » dans l'onglet Packages du dépôt.
#
# Publiées pour amd64 **et** arm64 : beaucoup de serveurs (Hetzner ARM, Raspberry Pi, Oracle
# Ampere, Mac) sont en ARM, et Docker refuse de tirer une image sans manifeste pour sa
# plateforme. Chaque architecture est construite sur une machine de sa propre architecture
# plutôt qu'en émulation QEMU : une image Next + Nest émulée met une heure, ici quelques
# minutes. Les runners ARM de GitHub sont gratuits sur les dépôts publics.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Une image par application et par architecture, poussée sans étiquette : seul son
  # empreinte (digest) compte, le manifeste commun est assemblé ensuite.
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # `github.repository` garde la casse du compte (MathieuDubart/…) alors qu'une
      # référence Docker doit être en minuscules : on la normalise une fois pour toutes.
      - name: Nom d'image et de plateforme
        run: |
          echo "IMAGE=${REGISTRY}/${REPO,,}-${APP}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          APP: ${{ matrix.app }}
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=YGO Deck Builder (${{ matrix.app }})
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le lien « code source » affiché aux utilisateurs (AGPL-3.0) pointe vers ce dépôt
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ env.PLATFORM_PAIR }}

      - name: Déposer l'empreinte
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Un seul manifeste par application, qui réunit les deux architectures et porte les tags.
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - name: Nom d'image en minuscules
        run: echo "IMAGE=${REGISTRY}/${REPO,,}-${APP}" >> "$GITHUB_ENV"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          APP: ${{ matrix.app }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Assembler le manifeste multi-architecture
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Vérifier les plateformes publiées
        run: docker buildx imagetools inspect "${IMAGE}:latest"
