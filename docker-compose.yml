# Déploiement complet (selfhost / VPS Scaleway, OVH, Infomaniak…)
#   cp .env.example .env   # puis remplir les secrets
#   docker compose up -d --build
#   docker compose exec api node -e "…"   # (voir README pour la 1re sync du catalogue)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ygo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-ygo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ygo}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ygo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ygo}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET requis}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      CARD_SYNC_CRON: ${CARD_SYNC_CRON:-0 4 * * 1}
      META_SYNC_CRON: ${META_SYNC_CRON:-0 5 * * 1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-180000}
      DUEL_ENABLED: ${DUEL_ENABLED:-true}
      DUEL_DATA_CRON: ${DUEL_DATA_CRON:-0 3 * * 2}
      DUEL_MAX_SESSIONS: ${DUEL_MAX_SESSIONS:-20}
      DUEL_IDLE_MINUTES: ${DUEL_IDLE_MINUTES:-30}
    volumes:
      # Scripts des cartes et bases du moteur de duel (téléchargés une fois, mis à jour par cron)
      - duel-data:/app/data/duel
    # Pas de port exposé : seul le front parle à l'API (réseau interne Docker)

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        SOURCE_URL: ${SOURCE_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - image-cache:/app/apps/web/.next/cache

volumes:
  db-data:
  image-cache:
  duel-data:
